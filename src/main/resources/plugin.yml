name: CrownSMP
version: ${version}
main: me.baljeetpabla.crownsmp.CrownSMP
api-version: '1.21.11'
author: BaljeetPabla13
description: Two legendary PvP crowns with equal base power and unique ultimates.
commands:
  crown:
    description: Manage the Light and Dark Crowns.
    usage: /crown give <light|dark> <player>
    permission: crownsmp.admin
permissions:
  crownsmp.admin:
    description: Manage CrownSMP crowns.
    default: op
